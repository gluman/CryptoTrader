# ============================================
# CryptoTrader Configuration
# ============================================
# Keys are loaded from .env file via environment variables

# ============================================
# Binance Exchange
# ============================================
binance:
  base_url: "https://api.binance.com"
  testnet_url: "https://testnet.binance.vision"
  websocket_url: "wss://stream.binance.com:9443"
  testnet: false
  rate_limit:
    orders_per_second: 10
    requests_per_minute: 1200

# ============================================
# Bybit Exchange
# ============================================
bybit:
  base_url: "https://api.bybit.com"
  testnet_url: "https://api-testnet.bybit.com"
  testnet: false
  recv_window: 5000
  rate_limit:
    orders_per_second: 10
    requests_per_minute: 600

# ============================================
# Bitfinex Exchange
# ============================================
bitfinex:
  base_url: "https://api-pub.bitfinex.com"
  auth_url: "https://api.bitfinex.com"
  testnet: false
  rate_limit:
    requests_per_second: 10
    requests_per_minute: 90

# ============================================
# CoinEx Exchange
# ============================================
coinex:
  base_url: "https://api.coinex.com"
  testnet: false
  rate_limit:
    requests_per_second: 10
    requests_per_minute: 300

# ============================================
# Telegram Bot
# ============================================
telegram:
  enabled: true
  notify_on:
    - error
    - trade_executed
    - signal_strong

# ============================================
# CoinDesk API
# ============================================
coindesk:
  base_url: "https://api.coindesk.com/v1"

# ============================================
# CryptoRank API
# ============================================
cryptorank:
  base_url: "https://api.cryptorank.io/v2"

# ============================================
# OpenRouter LLM
# ============================================
openrouter:
  base_url: "https://openrouter.ai/api/v1"
  model: "qwen/qwen3.6-plus:free"
  fallback_model: "stepfun/step-3.5-flash:free"
  temperature: 0.3
  max_tokens: 1024

# ============================================
# Ollama LLM (local fallback)
# ============================================
ollama:
  base_url: "http://192.168.0.94:11434"
  model: "qwen3.5:9b"
  fallback_model: "gemma4:latest"
  temperature: 0.3
  max_tokens: 1024

# ============================================
# PostgreSQL
# ============================================
postgresql:
  host: "127.0.0.1"
  port: 5433
  database: "cryptotrader"
  username: "cryptotrader"
  pool_size: 10
  max_overflow: 20

# ============================================
# RAGFlow
# ============================================
ragflow:
  base_url: "http://192.168.0.122:9380"
  api_key: "ragflow-wiOokfEkCTp3eHhPdSJ2lJUUuTn7bM_h_TdHqgPjJQg"
  dataset_id: "6c97aa7c488a11f1aa57696cdc5c350b"

# ============================================
# AnythingLLM
# ============================================
anythingllm:
  base_url: "http://192.168.0.133:3001"
